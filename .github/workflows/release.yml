name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build glibc and static musl binaries
        run: |
          cargo build --release --locked
          cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package direct binaries, tar.gz, deb, rpm, and AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm file libfuse2
          bash packaging/build-packages.sh "${GITHUB_REF_NAME#v}"

      - name: Upload Linux Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/monkeytype-tui-linux-x86_64
            dist/monkeytype-tui-linux-x86_64-static
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows binary
        run: cargo build --release --locked

      - name: Prepare direct executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\monkeytype-tui.exe dist\monkeytype-tui-windows-x86_64.exe

      - name: Upload Windows Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/monkeytype-tui-windows-x86_64.exe

  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: monkeytype-tui-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            asset: monkeytype-tui-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare direct binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/monkeytype-tui dist/${{ matrix.asset }}

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
